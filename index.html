<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4149d8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Et Anchhy — Full-Stack Web Developer</title>
    <meta name="description" content="Et Anchhy is a full-stack web developer and Information & Communication Engineering student building dependable products with Vue, NestJS, and Spring Boot." />
    <meta name="keywords" content="Et Anchhy, Web Developer, Vue.js, NestJS, Spring Boot, Full-Stack Developer, Portfolio" />
    <meta name="author" content="Et Anchhy" />

    <script>
      try {
        const theme = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (theme === 'dark' || (!theme && prefersDark)) document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="Et Anchhy — Full-Stack Web Developer" />
    <meta property="og:description" content="Full-stack developer and Year 4 ICE student building modern web applications with Vue.js, NestJS, and Spring Boot." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Et Anchhy",
        "jobTitle": "Full-Stack Web Developer",
        "address": { "@type": "PostalAddress", "addressLocality": "Phnom Penh", "addressCountry": "Cambodia" },
        "sameAs": ["https://github.com/Anchhy"]
      }
    </script>

    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
