<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Et Anchhy — Portfolio social preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { font-family: Arial, Helvetica, sans-serif; background: #090d18; color: #f7f8fc; }
      .card { position: relative; display: grid; width: 1200px; height: 630px; grid-template-columns: 1.2fr 0.8fr; overflow: hidden; background: radial-gradient(circle at 82% 15%, rgb(91 99 246 / 0.22), transparent 32%), #090d18; }
      .grid { position: absolute; inset: 0; opacity: 0.34; background-image: radial-gradient(rgb(139 145 255 / 0.28) 0.8px, transparent 0.8px); background-size: 20px 20px; mask-image: linear-gradient(to right, black, transparent 92%); }
      .content { position: relative; z-index: 2; display: flex; flex-direction: column; padding: 58px 0 48px 64px; }
      .brand { display: flex; align-items: center; gap: 14px; }
      .mark { display: grid; width: 54px; height: 54px; border-radius: 15px; place-items: center; background: #f7f8fc; color: #111827; font-size: 16px; font-weight: 900; }
      .brand div strong, .brand div span { display: block; }
      .brand div strong { font-size: 21px; }
      .brand div span { margin-top: 3px; color: #8c96a7; font-size: 12px; font-weight: 700; }
      .eyebrow { width: fit-content; margin-top: 62px; padding: 9px 13px; border: 1px solid #273149; border-radius: 999px; background: rgb(17 23 37 / 0.78); color: #a9adff; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; }
      h1 { max-width: 730px; margin: 20px 0 0; font-size: 66px; line-height: 0.96; letter-spacing: -4px; }
      h1 span { display: block; color: #9da2ff; }
      .summary { max-width: 690px; margin-top: 24px; color: #aab3c4; font-size: 20px; line-height: 1.55; }
      .proof { display: flex; gap: 10px; margin-top: auto; }
      .proof span { padding: 9px 12px; border: 1px solid #273149; border-radius: 9px; background: #111725; color: #c5ccda; font-size: 12px; font-weight: 700; }
      .portrait-wrap { position: relative; z-index: 1; display: grid; place-items: end center; padding: 52px 48px 0 0; }
      .portrait-accent { position: absolute; width: 354px; height: 480px; right: 49px; bottom: 35px; border-radius: 38px; background: linear-gradient(145deg, #5ed7bd, #747cff); transform: rotate(4deg); }
      .portrait { position: relative; width: 354px; height: 480px; overflow: hidden; border: 1px solid rgb(255 255 255 / 0.24); border-radius: 32px 32px 0 0; background: white; box-shadow: 0 26px 70px rgb(0 0 0 / 0.34); }
      .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
      .portrait::after { position: absolute; inset: 0; background: linear-gradient(to top, rgb(7 11 23 / 0.82), transparent 42%); content: ''; }
      .portrait-label { position: absolute; right: 26px; bottom: 24px; left: 26px; z-index: 2; }
      .portrait-label span { display: block; color: rgb(255 255 255 / 0.66); font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; }
      .portrait-label strong { display: block; margin-top: 7px; font-size: 20px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="grid"></div>
      <section class="content">
        <div class="brand">
          <span class="mark">EA</span>
          <div><strong>Et Anchhy</strong><span>Phnom Penh, Cambodia</span></div>
        </div>
        <p class="eyebrow">Fifth-year ICE student · Backend intern</p>
        <h1>Full-stack products<span>from interface to API.</span></h1>
        <p class="summary">Building dependable web experiences with TypeScript, NestJS, modern frontend frameworks, and PostgreSQL.</p>
        <div class="proof"><span>Vue · Angular · React</span><span>NestJS · Spring Boot</span><span>PostgreSQL · Docker</span></div>
      </section>
      <aside class="portrait-wrap">
        <div class="portrait-accent"></div>
        <figure class="portrait">
          <img src="../src/assets/mypic.webp" alt="Et Anchhy" width="827" height="1063" />
          <figcaption class="portrait-label"><span>Open to opportunities</span><strong>Full-Stack Web Developer</strong></figcaption>
        </figure>
      </aside>
    </main>
  </body>
</html>
